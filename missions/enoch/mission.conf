# Livonia is on stable.
GAME=stable
# Every server start is a fresh start: characters left over from a round in progress would
# otherwise come back with their gear, out on the map (tools/deploy.sh wipes on WIPE=1).
WIPE=1
# The clock runs at real time: a round keeps the time of day it starts at (morning, noon,
# night) to its end, and the lobby keeps the next round's while it waits.
TIME_ACCELERATION=1
